.l{left:0;background-position:0 0;transform-origin:0 50%;border-radius:3px 0 0 3px}
.r{right:0;background-position:100% 0;transform-origin:100% 50%;border-radius:0 3px 3px 0}
.open .l{transform:rotateY(-112deg)}
.open .r{transform:rotateY(112deg)}
.door::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.25));opacity:0;transition:opacity 1.5s}
.r::after{background:linear-gradient(270deg,rgba(0,0,0,0),rgba(0,0,0,.25))}
.open .door::after{opacity:1}
.gloss{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;transition:opacity .4s}
.gloss::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);transform:translateX(-120%);animation:gl 5s ease-in-out 1.5s infinite}
@keyframes gl{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.open .gloss{opacity:0}
.tap{position:absolute;z-index:5;left:50%;top:50%;width:38%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;cursor:pointer;outline:0}
.tap::before,.tap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:2px solid var(--gold);animation:ring 2.4s ease-out infinite}
.tap::after{animation-delay:1.2s}
@keyframes ring{from{transform:scale(.7);opacity:.9}to{transform:scale(1.25);opacity:0}}
.tap:focus-visible{box-shadow:0 0 0 3px var(--wine)}
.open .tap{pointer-events:none;opacity:0}
.bar{height:56px;flex:none;width:100%;margin-bottom:auto;display:flex;align-items:center;justify-content:center}
.hint{color:var(--wine);font-style:italic;font-size:clamp(14px,4vw,17px);animation:p 2s infinite}
@keyframes p{50%{opacity:.4}}
.btn{display:none;gap:8px;flex-wrap:nowrap}
.btn button,.btn a{font:600 14px Georgia,serif;color:#fff;background:var(--wine);border:0;border-radius:30px;padding:10px 18px;min-height:40px;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
body.done .open-btn,body.opening .open-btn{display:none}
.open-btn{font:700 18px Georgia,serif;letter-spacing:.06em;color:#fff;background:linear-gradient(135deg,#9a1236,#6b0a24);border:1.5px solid var(--gold);border-radius:32px;padding:11px 44px;min-height:44px;cursor:pointer;box-shadow:0 8px 18px -8px rgba(90,10,30,.8);animation:bp 2s ease-in-out infinite}
@keyframes bp{50%{transform:scale(1.06);box-shadow:0 0 0 7px rgba(217,178,95,.25)}}
.open-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}body.done .btn{display:flex}
@media (min-width:821px){.stage{width:min(calc(100vw - 16px),calc((100vh - 90px)*1000/1389));filter:drop-shadow(0 24px 30px rgba(60,25,5,.45))}}
@media (max-width:820px){.door{border-radius:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style></head>
<body>
<div class="stage" id="stage">
 <div class="page2" role="img" aria-label="Wedding invitation details: Tarique Imam Khan weds Fahmi Khan. Programme: Quran Khani and Milad un Nabi on Mon 16 Nov 2026 at 10:00 am; Jashn e Haldi Mon 16 Nov after Maghrib; Jashn e Manjha Tue 17 Nov after Isha; Walima/Dinner Fri 20 Nov after Maghrib. Venue: Ashiyana Palace and Resort, Sonpur, Saran."></div>
 <div class="door l"></div><div class="door r"></div>
 <div class="gloss"></div>
 <button class="tap" id="tap" aria-label="Tap to open the invitation"></button>
</div>
<div class="bar">
 <button class="open-btn" id="openBtn" type="button">Open</button>
 <div class="btn"><button id="close" type="button">Close card</button><a href="https://www.google.com/maps/search/?api=1&query=Ashiyana+Palace+%26+Resort+Sonpur" target="_blank" rel="noopener">Venue map</a></div>
</div>
<script>
var st=document.getElementById('stage'),t=document.getElementById('tap');
function open(){document.body.classList.add('opening');st.classList.add('open');setTimeout(function(){document.body.classList.add('done')},1400)}
t.addEventListener('click',open);document.getElementById('openBtn').addEventListener('click',open);
document.getElementById('close').addEventListener('click',function(){st.classList.remove('open');document.body.classList.remove('done','opening')});
</script></body></html>
